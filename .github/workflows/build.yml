name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare project structure
        run: |
          mkdir -p /tmp/src && cp pubspec.yaml *.dart /tmp/src/
          flutter create --platforms=android --project-name vf_offers --org com.vfoffers /tmp/proj
          rm -rf /tmp/proj/lib /tmp/proj/test
          mkdir /tmp/proj/lib
          cp /tmp/src/*.dart /tmp/proj/lib/
          cp /tmp/src/pubspec.yaml /tmp/proj/pubspec.yaml
          M=/tmp/proj/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          sed -i 's/android:label="[^"]*"/android:label="عروضي"/' $M
      - name: Build
        working-directory: /tmp/proj
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vf-offers-apk
          path: /tmp/proj/build/app/outputs/flutter-apk/app-release.apk
